---
- name: Deploy Local index.html to Gym Website
  hosts: gym-server
  gather_facts: yes
  vars:
    timestamp: "{{ ansible_date_time.epoch }}"
    local_html_file: "website/index.html"
    backup_current: "{{ backup_local | default(true) }}"

  tasks:
    - name: Check if local HTML file exists
      stat:
        path: "{{ local_html_file }}"
      register: local_file
      delegate_to: localhost
      become: false

    - name: Fail if local HTML file doesn't exist
      fail:
        msg: "{{ local_html_file }} not found in current directory!"
      when: not local_file.stat.exists

    - name: Display file info
      debug:
        msg: "Deploying {{ local_html_file }} ({{ (local_file.stat.size / 1024) | round(2) }}KB)"

    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      when: backup_current | bool

    - name: Backup current index.html
      copy:
        src: "{{ web_root }}/index.html"
        dest: "{{ backup_dir }}/index-backup-{{ timestamp }}.html"
        remote_src: yes
      when: backup_current | bool
      ignore_errors: yes

    - name: Copy local index.html to server
      copy:
        src: "{{ local_html_file }}"
        dest: "{{ web_root }}/index.html"
        owner: apache
        group: apache
        mode: '0644'

    - name: Test website accessibility
      uri:
        url: "http://{{ ansible_host }}/"
        method: GET
        status_code: 200
      delegate_to: localhost
      register: website_check

    - name: Display deployment summary
      debug:
        msg: |
          Local deployment completed successfully!
          - File deployed: {{ local_html_file }}
          - Size: {{ (local_file.stat.size / 1024) | round(2) }}KB
          - Backup: {{ 'Created' if backup_current else 'Skipped' }}
          - Website URL: http://{{ ansible_host }}/
          - Website test: {{ 'PASSED' if website_check.status == 200 else 'FAILED' }}