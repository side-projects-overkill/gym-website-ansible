{% extends "base.html" %}
{% block title %}Set Password - Gym Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h1 style="text-align:center;">🔑 Set Your Password</h1>
        <p class="subtitle">You're verified! Choose a password to finish setting up your account.</p>
        <form method="post">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required autofocus>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>

            <button class="btn" type="submit" style="width:100%; margin-top:16px;">Set Password &amp; Finish</button>
        </form>
    </div>
</div>
{% endblock %}
