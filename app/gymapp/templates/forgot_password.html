{% extends "base.html" %}
{% block title %}Forgot Password - Gym Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h1 style="text-align:center;">🤔 Forgot Password</h1>
        <p class="subtitle">We'll send a reset link to your linked Telegram account.</p>
        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <button class="btn" type="submit" style="width:100%; margin-top:16px;">Send Reset Link</button>
        </form>
    </div>
    <p style="text-align:center;"><a href="{{ url_for('member.login') }}">&larr; Back to login</a></p>
</div>
{% endblock %}
