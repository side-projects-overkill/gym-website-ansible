{% extends "base.html" %}
{% block title %}Reset Password - Gym Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h1 style="text-align:center;">🔑 Reset Your Password</h1>
        <p class="subtitle">Choose a new password for your account.</p>
        <form method="post">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required autofocus>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>

            <button class="btn" type="submit" style="width:100%; margin-top:16px;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
