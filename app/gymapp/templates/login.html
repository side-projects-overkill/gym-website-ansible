{% extends "base.html" %}
{% block title %}Login - Gym Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h1 style="text-align:center;">🔒 Log In</h1>
        <p class="subtitle">Gym Tracker</p>
        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button class="btn" type="submit" style="width:100%;">Log In</button>
        </form>
        <p style="text-align:center; margin-top:12px;"><a href="{{ url_for('registration.forgot_password') }}">Forgot password?</a></p>
    </div>
    <p style="text-align:center;">
        New here? <a href="{{ url_for('registration.register') }}">Create an account</a>
    </p>
    <p style="text-align:center;"><a href="{{ url_for('public.index') }}">&larr; Back to site</a></p>
</div>
{% endblock %}
