{% extends "base.html" %}
{% block title %}Login - Gym Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card">
        <h1 class="center">Welcome back</h1>
        <p class="subtitle">Log in to your Gym Tracker</p>
        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button class="btn btn-block" type="submit">Log in</button>
        </form>
        <p class="center small-gap"><a href="{{ url_for('registration.forgot_password') }}">Forgot password?</a></p>
    </div>
    <p class="center">
        New here? <a href="{{ url_for('registration.register') }}">Create an account</a>
    </p>
    <p class="center"><a href="/guide">&larr; Back to the guide</a></p>
</div>
{% endblock %}
