name: Tests

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt
          # Runtime deps mirror what the server installs via dnf; on CI we
          # use PyPI equivalents of the same packages.
          pip install "Flask>=3.0" "PyYAML>=6.0" "requests>=2.31"

      - name: Run test suite
        run: ./scripts/run-python-tests.sh

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install community collections
        run: ansible-galaxy collection install community.general ansible.posix

      - name: Syntax-check all playbooks
        run: |
          status=0
          for p in playbooks/*.yml; do
            echo "::group::$p"
            ansible-playbook --syntax-check "$p" || status=1
            echo "::endgroup::"
          done
          exit $status
